<div class="ttt-main-container">
  <div class="ttt-game-panel">
    <div class="ttt-turn-indicator" *ngIf="!winner && !isDraw">
      Player <span [class.ttt-x]="currentPlayer==='X'" [class.ttt-o]="currentPlayer==='O'">{{ currentPlayer }}</span>'s turn
    </div>
    <div class="ttt-status" *ngIf="winner">
      <span class="ttt-winner">Player {{ winner }} wins!</span>
    </div>
    <div class="ttt-status" *ngIf="isDraw && !winner">
      <span class="ttt-draw">It's a draw!</span>
    </div>
    <div class="ttt-grid">
      <div
        *ngFor="let row of board; let i = index"
        class="ttt-row"
      >
        <button
          *ngFor="let cell of row; let j = index"
          class="ttt-cell"
          [disabled]="!!cell || winner || isDraw"
          (click)="handleCellClick(i, j)"
        >
          <span [class.ttt-x]="cell==='X'" [class.ttt-o]="cell==='O'">{{ cell || '' }}</span>
        </button>
      </div>
    </div>
    <button class="ttt-reset-btn" type="button" (click)="resetGame()">
      Reset Game
    </button>
  </div>
</div>
